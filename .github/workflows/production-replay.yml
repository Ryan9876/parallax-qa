name: Parallax Production Replay

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: parallax-production-replay
  cancel-in-progress: false

jobs:
  w9-s1-p02341-post-failure-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request bounded Parallax QA OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Read exact W9-S1 state after publication failure
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          API_BASE: https://parallax-api-tan.vercel.app
          RUN_ID: a64d56b7-ad42-42ad-9562-891783363f4a
        run: |
          set -euo pipefail
          cookie_jar="/tmp/parallax-w9-s1-p02341-post.cookies"
          session_status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --cookie-jar "${cookie_jar}" -H "Authorization: Bearer ${OIDC_TOKEN}" -X POST "${API_BASE}/v1/session/qa-automation")"
          echo "QA session status=${session_status}"
          test "${session_status}" = "200"
          jq -e '.authenticated == true' /tmp/session.json >/dev/null
          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}" > /tmp/run.json
          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}/events?after_sequence=16&limit=200" > /tmp/events.json
          echo 'W9-S1 current:'
          jq -c '{id,state,revision,binding_status,resume_stage,last_failure_code}' /tmp/run.json
          echo 'Latest cycle attempts:'
          jq -c '.attempts[-12:][]? | {stage,status,failure_code,evidence:{source_lineage_ref:.evidence.source_lineage_ref,base_source_lineage_ref:.evidence.base_source_lineage_ref,workspace_digest:.evidence.workspace_digest,review_rework_context_digest:.evidence.review_rework_context_digest,review_rework_acceptance_ids:.evidence.review_rework_acceptance_ids,verification_scope:.evidence.verification_scope,acceptance_ids_verified:.evidence.acceptance_ids_verified,acceptance_ids_unverified:.evidence.acceptance_ids_unverified}}' /tmp/run.json
          echo 'New durable events:'
          jq -c '.events[]? | {sequence,event_type,stage,outcome,subsystem,failure_code,source_lineage_ref,evidence_ref,summary,metadata}' /tmp/events.json
