name: Parallax Production Replay

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: parallax-production-replay
  cancel-in-progress: false

jobs:
  w9-s1-p02342-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request bounded Parallax QA OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Confirm exact later blocker after P2-V0.23.42 classification fix
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          API_BASE: https://parallax-api-tan.vercel.app
          RUN_ID: a64d56b7-ad42-42ad-9562-891783363f4a
        run: |
          set -euo pipefail
          cookie_jar="/tmp/parallax-w9-s1-p02342-evidence.cookies"
          session_status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --cookie-jar "${cookie_jar}" -H "Authorization: Bearer ${OIDC_TOKEN}" -X POST "${API_BASE}/v1/session/qa-automation")"
          test "${session_status}" = "200"
          jq -e '.authenticated == true' /tmp/session.json >/dev/null

          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}" > /tmp/run.json
          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}/events?after_sequence=31&limit=100" > /tmp/events.json

          jq -c '{id,state,revision,last_failure_code}' /tmp/run.json
          jq -c '.events[]? | {sequence,event_type,outcome,subsystem,failure_code,source_lineage_ref,metadata}' /tmp/events.json
          jq -e '.state == "REVIEW" and .revision == 12 and .last_failure_code == null' /tmp/run.json >/dev/null
          jq -e '.events[]? | select(.event_type == "SOURCE_DELIVERY" and .outcome == "FAILED" and ((.metadata.result_code // .failure_code // "") == "BRANCH_CONFLICT"))' /tmp/events.json >/dev/null
          if jq -e '.events[]? | select((.metadata.result_code // .failure_code // "") == "GREENFIELD_BASELINE_MISMATCH")' /tmp/events.json >/dev/null; then
            echo 'GREENFIELD_BASELINE_MISMATCH recurred after P2-V0.23.42' >&2
            exit 22
          fi
