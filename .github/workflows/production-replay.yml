name: Parallax Production Replay

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: parallax-production-replay
  cancel-in-progress: false

jobs:
  w9-s1-p02342-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Request bounded Parallax QA OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          request_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=parallax%3A%2F%2Fqa-production"
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${request_url}" | jq -r '.value')"
          test -n "${token}"
          test "${token}" != "null"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Retry exact frozen W9-S1 replacement publication
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          API_BASE: https://parallax-api-tan.vercel.app
          RUN_ID: a64d56b7-ad42-42ad-9562-891783363f4a
          REPLACEMENT_LINEAGE: src:001736ab731e243956cf78ede7a0087d2b81595f1008568850eac1e9acc3e809
        run: |
          set -euo pipefail
          cookie_jar="/tmp/parallax-w9-s1-p02342.cookies"

          session_status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --cookie-jar "${cookie_jar}" -H "Authorization: Bearer ${OIDC_TOKEN}" -X POST "${API_BASE}/v1/session/qa-automation")"
          echo "QA session status=${session_status}"
          test "${session_status}" = "200"
          jq -e '.authenticated == true' /tmp/session.json >/dev/null

          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}" > /tmp/run-before.json
          echo 'W9-S1 before:'
          jq -c '{id,state,revision,last_failure_code}' /tmp/run-before.json
          jq -e '.state == "REVIEW" and .revision == 12 and .last_failure_code == null' /tmp/run-before.json >/dev/null

          autonomous_status="$(curl --silent --show-error --output /tmp/autonomous.json --write-out '%{http_code}' --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" -H 'Content-Type: application/json' -X POST --data '{"operation_key":"w9-s1-p2-v0-23-42-production-acceptance","expected_revision":12}' "${API_BASE}/v1/engineering-runs/${RUN_ID}/autonomous")"
          echo "W9-S1 autonomous status=${autonomous_status}"
          jq -c . /tmp/autonomous.json || cat /tmp/autonomous.json
          test "${autonomous_status}" = "200"

          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}" > /tmp/run-after.json
          curl --fail-with-body --silent --show-error --cookie "${cookie_jar}" -H "X-Parallax-Session: 1" "${API_BASE}/v1/engineering-runs/${RUN_ID}/events?after_sequence=31&limit=100" > /tmp/events-after.json

          echo 'W9-S1 after:'
          jq -c '{id,state,revision,last_failure_code}' /tmp/run-after.json
          echo 'W9-S1 durable events after sequence 31:'
          jq -c '.events[]? | {sequence,event_type,stage,outcome,subsystem,failure_code,source_lineage_ref,evidence_ref,summary,metadata}' /tmp/events-after.json

          jq -e '.state == "REVIEW" and .revision == 12 and .last_failure_code == null' /tmp/run-after.json >/dev/null
          jq -e --arg lineage "${REPLACEMENT_LINEAGE}" '.events[]? | select(.event_type == "SOURCE_DELIVERY" and .outcome == "SUCCEEDED" and .source_lineage_ref == $lineage)' /tmp/events-after.json >/dev/null
          if grep -q 'GREENFIELD_BASELINE_MISMATCH' /tmp/autonomous.json; then
            echo 'GREENFIELD_BASELINE_MISMATCH recurred in response' >&2
            exit 21
          fi
          if jq -e '.events[]? | select((.metadata.result_code // "") == "GREENFIELD_BASELINE_MISMATCH")' /tmp/events-after.json >/dev/null; then
            echo 'GREENFIELD_BASELINE_MISMATCH recurred in durable evidence' >&2
            exit 22
          fi
          jq -e '.stop_reason == "REVIEW_REQUIRED" and .run.state == "REVIEW" and .run.revision == 12' /tmp/autonomous.json >/dev/null
