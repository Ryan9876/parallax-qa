name: Parallax Production Replay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: parallax-production-replay
  cancel-in-progress: false

jobs:
  p2-v02347-behavioral-plan-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Request bounded Parallax QA identity
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const jwt = await core.getIDToken('parallax://qa-production')
            core.setSecret(jwt)
            fs.writeFileSync('/tmp/parallax-qa.jwt', jwt, { mode: 0o600 })

      - name: Prove P2-V0.23.47 behavioral verification plan contract
        shell: bash
        env:
          API_BASE: https://parallax-api-tan.vercel.app
          RUN_ID: a64d56b7-ad42-42ad-9562-891783363f4a
        run: |
          set -euo pipefail
          qa_jwt="$(cat /tmp/parallax-qa.jwt)"
          rm -f /tmp/parallax-qa.jwt
          cookie_jar="/tmp/parallax-p02347.cookies"

          session_status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --cookie-jar "${cookie_jar}" -H "Authorization: Bearer ${qa_jwt}" -X POST "${API_BASE}/v1/session/qa-automation")"
          unset qa_jwt
          echo "QA session status=${session_status}"
          test "${session_status}" = "200"
          jq -e '.authenticated == true' /tmp/session.json >/dev/null

          . ./scripts/p02347_behavioral_plan_acceptance.sh
